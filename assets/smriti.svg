<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- self-contained panel so it reads on any page theme -->
  <rect x="0" y="0" width="900" height="380" rx="16" fill="#0e1014"/>

  <!-- title -->
  <text x="40" y="58" font-size="30" font-weight="800" fill="#ffffff">smriti</text>
  <text x="42" y="84" font-size="15" fill="#9aa3b2">plain-text memory for AI agents — no database, no embeddings, no dependencies</text>

  <!-- AI agent -->
  <rect x="40" y="150" width="150" height="135" rx="14" fill="#1b2233" stroke="#33405c" stroke-width="1.5"/>
  <text x="115" y="212" text-anchor="middle" font-size="17" font-weight="700" fill="#e8ebf2">AI agent</text>
  <text x="115" y="234" text-anchor="middle" font-size="11" fill="#6b7385">your app · any model</text>

  <!-- WRITE path (top): agent -> store, through filter + compress gates -->
  <line x1="192" y1="190" x2="586" y2="190" stroke="#57c97a" stroke-width="2"/>
  <path d="M598 190 L584 184 L584 196 Z" fill="#57c97a"/>
  <text x="210" y="148" font-size="13" font-weight="600" fill="#57c97a">write(fact)</text>

  <!-- gate: filter -->
  <rect x="236" y="169" width="108" height="42" rx="21" fill="#16241b" stroke="#57c97a" stroke-width="1.5"/>
  <text x="290" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#e8ebf2">filter</text>
  <text x="290" y="201" text-anchor="middle" font-size="9.5" fill="#9aa3b2">keep what's durable</text>

  <!-- gate: compress -->
  <rect x="398" y="169" width="108" height="42" rx="21" fill="#16241b" stroke="#57c97a" stroke-width="1.5"/>
  <text x="452" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#e8ebf2">compress</text>
  <text x="452" y="201" text-anchor="middle" font-size="9.5" fill="#9aa3b2">hook + seed</text>

  <!-- READ path (bottom): store -> agent -->
  <line x1="586" y1="250" x2="206" y2="250" stroke="#5aa9e6" stroke-width="2"/>
  <path d="M194 250 L208 244 L208 256 Z" fill="#5aa9e6"/>
  <text x="396" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#5aa9e6">context()  ·  recall()</text>
  <text x="396" y="272" text-anchor="middle" font-size="10.5" fill="#9aa3b2">the cheap index, injected each turn — descend on a match (+1 hop along links)</text>

  <!-- THE STORE -->
  <text x="600" y="110" font-size="12" fill="#9aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">memory/</text>
  <rect x="600" y="120" width="270" height="180" rx="14" fill="#141822" stroke="#2c3446" stroke-width="1.5"/>

  <!-- stack of markdown files -->
  <rect x="628" y="142" width="168" height="30" rx="6" fill="#1f2636" stroke="#3a455e"/>
  <rect x="636" y="152" width="168" height="30" rx="6" fill="#1f2636" stroke="#3a455e"/>
  <rect x="644" y="162" width="168" height="30" rx="6" fill="#222b3d" stroke="#3a455e"/>
  <text x="656" y="181" font-size="11" fill="#cdd3df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">decision.md</text>
  <text x="796" y="181" text-anchor="end" font-size="12" fill="#57c97a">✓</text>

  <!-- index card -->
  <rect x="636" y="210" width="198" height="36" rx="8" fill="#11331f" stroke="#57c97a" stroke-width="1.5"/>
  <text x="650" y="232" font-size="12" fill="#e8ebf2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">INDEX.md</text>
  <text x="822" y="232" text-anchor="end" font-size="10" fill="#9aa3b2">one line each</text>

  <text x="735" y="282" text-anchor="middle" font-size="11" fill="#9aa3b2">plain markdown · versioned by git</text>

  <!-- PRUNE -->
  <path d="M610 330 q-26 0 -26 -22" fill="none" stroke="#e0655a" stroke-width="2"/>
  <path d="M584 312 L578 326 L590 324 Z" fill="#e0655a"/>
  <text x="620" y="335" font-size="13" font-weight="600" fill="#e0655a">prune</text>
  <text x="678" y="335" font-size="11" fill="#9aa3b2">— sweep out stale · duplicate · broken</text>
</svg>
